<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>神保町 jinbocho.app — 瀏覽、搜尋及轉讓書刊</title>
    <meta name="description" content="神保町 jinbocho.app — 瀏覽及搜尋香港書刊資料，建立自己的書架並標示二手售價。" />
    <link rel="stylesheet" href="styles.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Installed-app behaviour. The theme colour tracks the top bar rather
         than the brand terracotta, so the status bar blends into the page
         instead of sitting on it as a stripe. -->
    <meta id="tc-light" name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta id="tc-dark" name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e18" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="神保町" />
    <meta name="application-name" content="神保町" />

    <script defer src="install.js"></script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="神保町" />
    <meta property="og:title" content="神保町 jinbocho.app" />
    <meta property="og:description" content="瀏覽及搜尋香港書刊資料，建立自己的書架並標示二手售價。" />
    <meta property="og:image" content="https://jinbocho.app/icons/icon-512.png" />
    <meta property="og:url" content="https://jinbocho.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="神保町 jinbocho.app" />
    <meta name="twitter:description" content="瀏覽及搜尋香港書刊資料，建立自己的書架並標示二手售價。" />
    <meta name="twitter:image" content="https://jinbocho.app/icons/icon-512.png" />
  </head>
  <body>
    <a class="skip" href="#results">跳至結果</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="神保町 首頁">
          <img class="brand-mark" src="icons/icon-64.png" width="30" height="30" alt="" />
          <span class="brand-text">
            <strong>神保町</strong>
            <small id="brand-sub">載入中…</small>
          </span>
        </a>

        <form class="search" role="search" id="search-form">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input
            id="q"
            type="search"
            name="q"
            placeholder="搜尋書名、著者、出版者、ISBN…"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜尋書刊"
          />
          <kbd class="hint">/</kbd>
        </form>

        <div class="topbar-actions">
          <a class="btn ghost" href="#/shelf" id="shelf-link">我的書架 <span class="badge" id="shelf-count" hidden>0</span></a>
          <a class="btn ghost" href="#/about">資料說明</a>
          <button class="btn icon" id="theme-toggle" type="button" title="切換主題" aria-label="切換主題">
            <span aria-hidden="true">◐</span>
          </button>
        </div>
      </div>
    </header>

    <main id="app">
      <!-- Browse view -->
      <div id="browse-view">
        <button class="filters-toggle btn" id="filters-toggle" type="button" aria-expanded="false">
          篩選 <span class="badge" id="filters-count" hidden>0</span>
        </button>

        <aside class="sidebar" id="sidebar" aria-label="篩選">
          <div class="sidebar-head">
            <h2>篩選</h2>
            <button class="linkish" id="clear-filters" type="button">重設</button>
          </div>
          <div id="facets"></div>
        </aside>

        <section class="results" id="results" aria-live="polite">
          <div class="toolbar">
            <p class="count" id="count">載入書刊…</p>
            <div class="toolbar-right">
              <label class="select">
                <span>排序</span>
                <select id="sort">
                  <option value="relevance">相關度</option>
                  <option value="title">書名 A–Z</option>
                  <option value="title-desc">書名 Z–A</option>
                  <option value="year-desc">出版年份（新至舊）</option>
                  <option value="year">出版年份（舊至新）</option>
                  <option value="publisher">出版者</option>
                </select>
              </label>
              <div class="viewtoggle" role="group" aria-label="版面">
                <button type="button" data-view="grid" class="active" title="格狀">▦</button>
                <button type="button" data-view="list" title="列表">☰</button>
              </div>
            </div>
          </div>

          <div id="chips" class="chips"></div>
          <div id="grid" class="grid"></div>
          <div id="sentinel"></div>
          <div id="empty" class="empty" hidden></div>
          <button class="btn more" id="more" type="button" hidden>載入更多</button>
        </section>
      </div>

      <!-- Detail view -->
      <div id="detail-view" hidden></div>
      <!-- About view -->
      <div id="about-view" hidden></div>
      <!-- Bookshelf -->
      <div id="shelf-view" hidden></div>
    </main>

    <footer class="footer">
      <p id="footer-text"></p>
    </footer>

    <script src="tokenize.js"></script>
    <script src="schema.js"></script>
    <script src="app.js"></script>
  </body>
</html>
